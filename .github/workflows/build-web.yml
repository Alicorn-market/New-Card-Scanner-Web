name: Build Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate the web project files
        run: |
          flutter create --platforms=web --org com.cardlink --project-name cardlink /tmp/scaffold_web
          cp -r /tmp/scaffold_web/web ./web

      - name: Add the reading engine, app name and colour
        run: |
          sed -i 's|</head>|  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>\n</head>|' web/index.html
          sed -i 's|<title>[^<]*</title>|<title>QARDIVO</title>|' web/index.html
          sed -i 's|<meta name="apple-mobile-web-app-title" content="[^"]*">|<meta name="apple-mobile-web-app-title" content="QARDIVO">|' web/index.html
          sed -i 's/"name": "[^"]*"/"name": "QARDIVO"/; s/"short_name": "[^"]*"/"short_name": "QARDIVO"/; s/"theme_color": "[^"]*"/"theme_color": "#0B3C5D"/' web/manifest.json
          grep -n tesseract web/index.html
          cat web/manifest.json

      - name: Install packages
        run: flutter pub get

      - name: Build the website
        run: flutter build web --release

      - name: Save the website files (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: cardlink-web
          path: build/web
          retention-days: 30

      - name: Publish the website files to the web-build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web-build
          publish_dir: ./build/web
          force_orphan: true
