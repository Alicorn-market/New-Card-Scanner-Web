name: cardlink
description: Scan business cards and share a digital business card.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  cunning_document_scanner: ^1.2.3
  google_mlkit_text_recognition: ^0.13.1
  flutter_contacts: ^1.1.9+2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.0

flutter:
  uses-material-design: true
